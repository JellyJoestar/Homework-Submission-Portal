name: IFN636 CD - Two-Runner Source Deployment

on:
  # Automatically deploy after changes are pushed or merged into main.
  push:
    branches:
      - main

  # Allow manual deployment from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ifn636-cd-main
  cancel-in-progress: false

jobs:
  # ============================================================
  # Run Pytest Before Deployment
  # ============================================================
  test:
    name: Run pytest before deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

  # ============================================================
  # Server 1 - Source Deployment and Flask Application Activation
  # ============================================================
  deploy-server-1:
    name: Deploy Source to Server 1
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, Linux, X64, Server-1]
    environment: production
    timeout-minutes: 10

    steps:
      # Step 1: Checkout the selected Git revision.
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Step 2: Verify Runner 1 identity and commit.
      - name: Verify Runner 1
        shell: bash
        run: |
          set -euo pipefail

          test "$(whoami)" = "githubrunner"
          test "$(hostname)" = "ip-172-31-75-62"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          echo "Runner 1 identity: PASS"

      # Step 3: Verify the installed activation helper.
      - name: Verify Server 1 activation helper integrity
        shell: bash
        run: |
          set -euo pipefail

          source_script="$GITHUB_WORKSPACE/scripts/activate_release.sh"
          installed_script="/usr/local/sbin/ifn636-activate-release"

          test -f "$source_script"
          test -x "$installed_script"

          expected="$(sha256sum "$source_script" | awk '{print $1}')"
          actual="$(sha256sum "$installed_script" | awk '{print $1}')"

          echo "Server 1 repository SHA-256: $expected"
          echo "Server 1 installed SHA-256: $actual"

          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Server 1 activation helper mismatch"
            echo "ERROR: Manually synchronize the activation helper before deployment."
            exit 1
          fi

          echo "Server 1 activation helper integrity: PASS"

      # Step 4: Package the selected source revision.
      - name: Package selected commit
        shell: bash
        run: |
          set -euo pipefail

          git archive --format=tar "$GITHUB_SHA" |
            gzip -n > "$RUNNER_TEMP/release-$GITHUB_SHA.tar.gz"

      # Step 5: Install the versioned source release.
      - name: Install Server 1 source release
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/release-$GITHUB_SHA.tar.gz"

          bash scripts/install_source_release.sh \
            "$archive" "$GITHUB_SHA"

          test "$(cat "/opt/homework-portal/releases/$GITHUB_SHA/DEPLOYED_COMMIT")" = "$GITHUB_SHA"

          echo "Server 1 source deployment: PASS"

      # Step 6: Activate the selected release using PM2.
      - name: Activate Server 1 Flask release
        shell: bash
        run: |
          set -euo pipefail

          sudo -n -u ubuntu \
            /usr/local/sbin/ifn636-activate-release \
            "$GITHUB_SHA"

          echo "Server 1 application activation: PASS"

  # ============================================================
  # Server 2 - Source Deployment and Flask Application Activation
  # ============================================================
  deploy-server-2:
    name: Deploy Source to Server 2
    if: github.ref == 'refs/heads/main'
    needs: deploy-server-1
    runs-on: [self-hosted, Linux, X64, Server-2]
    environment: production
    timeout-minutes: 10

    steps:
      # Step 1: Checkout the selected Git revision.
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Step 2: Verify Runner 2 identity and commit.
      - name: Verify Runner 2
        shell: bash
        run: |
          set -euo pipefail

          test "$(whoami)" = "githubrunner2"
          test "$(hostname)" = "ip-172-31-78-128"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          echo "Runner 2 identity: PASS"

      # Step 3: Verify the installed activation helper.
      - name: Verify Server 2 activation helper integrity
        shell: bash
        run: |
          set -euo pipefail

          source_script="$GITHUB_WORKSPACE/scripts/activate_release.sh"
          installed_script="/usr/local/sbin/ifn636-activate-release"

          test -f "$source_script"
          test -x "$installed_script"

          expected="$(sha256sum "$source_script" | awk '{print $1}')"
          actual="$(sha256sum "$installed_script" | awk '{print $1}')"

          echo "Server 2 repository SHA-256: $expected"
          echo "Server 2 installed SHA-256: $actual"

          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Server 2 activation helper mismatch"
            echo "ERROR: Manually synchronize the activation helper before deployment."
            exit 1
          fi

          echo "Server 2 activation helper integrity: PASS"

      # Step 4: Package the selected source revision.
      - name: Package selected commit
        shell: bash
        run: |
          set -euo pipefail

          git archive --format=tar "$GITHUB_SHA" |
            gzip -n > "$RUNNER_TEMP/release-$GITHUB_SHA.tar.gz"

      # Step 5: Install the versioned source release.
      - name: Install Server 2 source release
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/release-$GITHUB_SHA.tar.gz"

          bash scripts/install_source_release.sh \
            "$archive" "$GITHUB_SHA"

          test "$(cat "/opt/homework-portal/releases/$GITHUB_SHA/DEPLOYED_COMMIT")" = "$GITHUB_SHA"

          echo "Server 2 source deployment: PASS"

      # Step 6: Activate the selected release using PM2.
      - name: Activate Server 2 Flask release
        shell: bash
        run: |
          set -euo pipefail

          sudo -n -u ubuntu \
            /usr/local/sbin/ifn636-activate-release \
            "$GITHUB_SHA"

          echo "Server 2 application activation: PASS"