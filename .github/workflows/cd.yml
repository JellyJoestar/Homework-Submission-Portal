
name: IFN636 CD - Deployment Verification

on:
  workflow_dispatch:

permissions: {}

jobs:
  deployment-path-check:
    name: Verify CD Deployment Path
    runs-on: [self-hosted, Linux, X64, Server-1]
    timeout-minutes: 5

    steps:
      - name: Verify release information
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "main"

      - name: Verify Server 1 deployment access
        run: |
          test "$(whoami)" = "githubrunner"
          test "$(hostname)" = "ip-172-31-75-62"
          test -w /opt/homework-portal
          echo "Server 1 deployment path: PASS"

      - name: Verify Server 2 deployment access
        run: |
          ssh -T \
            -i "$HOME/.ssh/ifn636_server2_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=5 \
            ifn636deploy@172.31.78.128 \
            'test "$(whoami)" = "ifn636deploy" && test -w /opt/homework-portal && echo "Server 2 deployment path: PASS"
