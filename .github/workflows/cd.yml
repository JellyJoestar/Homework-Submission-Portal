
      - name: Verify Server 2 deployment access
        run: |
          ssh -T \
            -i "$HOME/.ssh/ifn636_server2_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=5 \
            ifn636deploy@172.31.78.128 \
            'test "$(whoami)" = "ifn636deploy" && test -w /opt/homework-portal && echo "Server 2 deployment path: PASS"'