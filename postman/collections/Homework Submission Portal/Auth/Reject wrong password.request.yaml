$kind: http-request
description: |-
  Negative test: the right email with a wrong password must be rejected with
  401 and the "Invalid email or password." message. Runs before the valid
  login, so the session from "Get login page" is still logged out.
method: POST
url: "{{baseUrl}}/login"
order: 1500
headers:
  Cookie: session={{session_cookie}}
body:
  type: urlencoded
  content:
    email: "{{teacherEmail}}"
    password: wrong-password
    csrf_token: "{{csrf_token}}"
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 401 (wrong credentials)", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Shows the invalid credentials message", function () {
          pm.expect(pm.response.text()).to.include("Invalid email or password.");
      });

      pm.test("Does not redirect to the teacher pages", function () {
          pm.response.to.not.have.header("Location");
      });
