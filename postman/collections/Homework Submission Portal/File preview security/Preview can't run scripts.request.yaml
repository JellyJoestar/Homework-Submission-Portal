$kind: http-request
description: |-
  The preview of the DOCX with a script link is shown, but every preview
  response is sandboxed: Content-Security-Policy: sandbox stops scripts and
  javascript: links, and X-Content-Type-Options: nosniff stops the browser
  from guessing another file type.
method: GET
url: "{{baseUrl}}/student/submissions/{{preview_submission_id}}/preview"
order: 5000
headers:
  Cookie: session={{student_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Security-Policy is sandbox (no scripts)", function () {
          pm.expect(pm.response.headers.get("Content-Security-Policy")).to.equal("sandbox");
      });

      pm.test("X-Content-Type-Options is nosniff", function () {
          pm.expect(pm.response.headers.get("X-Content-Type-Options")).to.equal("nosniff");
      });
