$kind: http-request
description: |-
  The student submits tests/files/malicious-link.docx, which has a link to
  javascript:alert(document.cookie).
method: POST
url: "{{baseUrl}}/student/assessments/{{preview_assessment_id}}/submit"
order: 4000
headers:
  Cookie: session={{student_session}}
body:
  type: formdata
  content:
    - type: file
      key: submission_file
      src: tests/files/malicious-link.docx
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 302 (submitted)", function () {
          pm.response.to.have.status(302);
      });

      const submission = (pm.response.headers.get("Location") || "").match(/\/student\/submissions\/(\d+)/);

      pm.test("Redirects to the submission details", function () {
          pm.expect(submission, "Location: /student/submissions/<id>").to.not.be.null;
      });

      if (submission) {
          pm.environment.set("preview_submission_id", submission[1]);
      }
