$kind: http-request
description: Creates the independent Draft assessment limited to three submissions.
method: POST
url: "{{baseUrl}}/teacher/assessments"
order: 1100
headers:
  Cookie: session={{teacher_session}}
body:
  type: urlencoded
  content:
    title: "{{ifn636_107_title_limited}}"
    unit_id: "{{ifn636_107_unit_id}}"
    max_attempts: "3"
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Limited assessment is created", function () {
          pm.response.to.have.status(302);
          pm.expect(pm.response.headers.get("Location")).to.include("/teacher/assessments");
      });
