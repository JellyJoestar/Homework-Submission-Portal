$kind: http-request
description: Uses the Teacher endpoint to save the zero-grade edge case and feedback.
method: POST
url: "{{baseUrl}}/teacher/submissions/{{ifn636_107_submission_id_graded}}/mark-feedback"
order: 4200
headers:
  Cookie: session={{teacher_session}}
body:
  type: urlencoded
  content:
    mark: "0"
    feedback: IFN636-107 zero-grade feedback
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Teacher saves mark zero and feedback", function () {
          const submissionId = pm.environment.get("ifn636_107_submission_id_graded");
          pm.response.to.have.status(302);
          pm.expect(pm.response.headers.get("Location")).to.include("/teacher/submissions/" + submissionId);
      });
