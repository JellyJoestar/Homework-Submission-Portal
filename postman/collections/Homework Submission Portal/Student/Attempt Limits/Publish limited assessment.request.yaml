$kind: http-request
description: Publishes the dynamically discovered three-attempt assessment.
method: POST
url: "{{baseUrl}}/teacher/assessments/{{ifn636_107_assessment_id_limited}}/publish"
order: 1500
headers:
  Cookie: session={{teacher_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Limited assessment is published", function () {
          const id = pm.environment.get("ifn636_107_assessment_id_limited");
          pm.response.to.have.status(302);
          pm.expect(pm.response.headers.get("Location")).to.include("/teacher/assessments/" + id);
      });
