$kind: http-request
description: Attempts a valid resubmission after mark zero has been persisted.
method: POST
url: "{{baseUrl}}/student/assessments/{{ifn636_107_assessment_id_graded}}/submit"
order: 4400
headers:
  Cookie: session={{student_session}}
  Content-Type: multipart/form-data; boundary=IFN636GradedAttempt2
body:
  type: text
  content: |-
    --IFN636GradedAttempt2
    Content-Disposition: form-data; name="submission_file"; filename="ifn636-graded-attempt-2-rejected.pdf"
    Content-Type: application/pdf

    %PDF-1.4
    1 0 obj
    << /Type /Catalog /Pages 2 0 R >>
    endobj
    2 0 obj
    << /Type /Pages /Kids [3 0 R] /Count 1 >>
    endobj
    3 0 obj
    << /Type /Page /Parent 2 0 R /MediaBox [0 0 72 72] >>
    endobj
    xref
    0 4
    0000000000 65535 f
    0000000009 00000 n
    0000000058 00000 n
    0000000115 00000 n
    trailer
    << /Size 4 /Root 1 0 R >>
    startxref
    184
    %%EOF
    --IFN636GradedAttempt2--
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Graded resubmission is rejected", function () {
          pm.response.to.have.status(403);
          pm.expect(pm.response.text()).to.include("Graded submissions cannot be resubmitted.");
      });

      pm.test("Rejected graded resubmission does not redirect", function () {
          pm.response.to.not.have.header("Location");
      });
