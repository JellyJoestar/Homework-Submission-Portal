$kind: http-request
description: First valid PDF submission to the assessment limited to three attempts.
method: POST
url: "{{baseUrl}}/student/assessments/{{ifn636_107_assessment_id_limited}}/submit"
order: 2000
headers:
  Cookie: session={{student_session}}
  Content-Type: multipart/form-data; boundary=IFN636LimitAttempt1
body:
  type: text
  content: |-
    --IFN636LimitAttempt1
    Content-Disposition: form-data; name="submission_file"; filename="ifn636-limit-attempt-1.pdf"
    Content-Type: application/pdf

    %PDF-1.4
    1 0 obj
    << /Type /Catalog /Pages 2 0 R >>
    endobj
    2 0 obj
    << /Type /Pages /Kids [3 0 R] /Count 1 >>
    endobj
    3 0 obj
    << /Type /Page /Parent 2 0 R /MediaBox [0 0 72 72] >>
    endobj
    xref
    0 4
    0000000000 65535 f
    0000000009 00000 n
    0000000058 00000 n
    0000000115 00000 n
    trailer
    << /Size 4 /Root 1 0 R >>
    startxref
    184
    %%EOF
    --IFN636LimitAttempt1--
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const location = pm.response.headers.get("Location") || "";
      const submissionMatch = location.match(/\/student\/submissions\/(\d+)$/);

      pm.test("First limited submission redirects successfully", function () {
          pm.response.to.have.status(302);
          pm.expect(submissionMatch, "submission redirect").to.not.be.null;
      });

      if (submissionMatch) {
          pm.environment.set("ifn636_107_submission_id_limited", submissionMatch[1]);
      } else {
          pm.environment.unset("ifn636_107_submission_id_limited");
      }
