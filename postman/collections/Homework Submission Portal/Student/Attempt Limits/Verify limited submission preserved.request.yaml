$kind: http-request
description: Proves the rejected fourth upload changed neither count, ID nor latest filename.
method: GET
url: "{{baseUrl}}/student/assessments/{{ifn636_107_assessment_id_limited}}"
order: 2700
headers:
  Cookie: session={{student_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const html = pm.response.text().replace(/\s+/g, " ");
      const submissionId = pm.environment.get("ifn636_107_submission_id_limited");

      pm.test("Rejected fourth attempt leaves count at 3", function () {
          pm.response.to.have.status(200);
          pm.expect(html).to.include("<strong>Attempts:</strong> 3 of 3");
          pm.expect(html).to.include("<strong>Remaining attempts:</strong> 0");
      });

      pm.test("Third file and original submission ID remain current", function () {
          pm.expect(html).to.include("<strong>Latest filename:</strong> ifn636-limit-attempt-3.pdf");
          pm.expect(html).to.not.include("ifn636-limit-attempt-4-rejected.pdf");
          pm.expect(html).to.include('href="/student/submissions/' + submissionId + '"');
      });
