$kind: http-request
description: Verifies unlimited attempt one is persisted without a finite quota.
method: GET
url: "{{baseUrl}}/student/assessments/{{ifn636_107_assessment_id_unlimited}}"
order: 3050
headers:
  Cookie: session={{student_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const html = pm.response.text().replace(/\s+/g, " ");
      const submissionId = pm.environment.get("ifn636_107_submission_id_unlimited");

      pm.test("Unlimited attempt count increments to 1", function () {
          pm.response.to.have.status(200);
          pm.expect(html).to.include("<strong>Attempts:</strong> 1 — Unlimited");
          pm.expect(html).to.include("<strong>Remaining attempts:</strong> Unlimited");
      });

      pm.test("First unlimited file is current", function () {
          pm.expect(html).to.include("<strong>Latest filename:</strong> ifn636-unlimited-attempt-1.pdf");
          pm.expect(html).to.include('href="/student/submissions/' + submissionId + '"');
      });
