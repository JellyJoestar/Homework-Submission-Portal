$kind: http-request
description: Verifies four persisted attempts, Unlimited quota text and the latest file/link.
method: GET
url: "{{baseUrl}}/student/assessments/{{ifn636_107_assessment_id_unlimited}}"
order: 3400
headers:
  Cookie: session={{student_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const html = pm.response.text().replace(/\s+/g, " ");
      const title = pm.environment.get("ifn636_107_title_unlimited");
      const submissionId = pm.environment.get("ifn636_107_submission_id_unlimited");

      pm.test("Unlimited assessment details are available", function () {
          pm.response.to.have.status(200);
          pm.expect(html).to.include("<strong>Title:</strong> " + title);
      });

      pm.test("Four attempts are persisted with Unlimited quota", function () {
          pm.expect(html).to.include("<strong>Attempts:</strong> 4 — Unlimited");
          pm.expect(html).to.include("<strong>Remaining attempts:</strong> Unlimited");
          pm.expect(html).to.not.include('id="submission-limit-message"');
      });

      pm.test("Fourth unlimited file remains current on the same submission", function () {
          pm.expect(html).to.include("<strong>Latest filename:</strong> ifn636-unlimited-attempt-4.pdf");
          pm.expect(html).to.include('href="/student/submissions/' + submissionId + '"');
      });
