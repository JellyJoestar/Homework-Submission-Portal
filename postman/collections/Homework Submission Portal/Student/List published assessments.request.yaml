$kind: http-request
description: Student home with the published assessments, with the session saved by "Auth / Log in as student".
method: GET
url: "{{baseUrl}}/student"
order: 1000
headers:
  Cookie: session={{student_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is present", function () {
          pm.response.to.have.header("Content-Type");
      });

      pm.test("Body matches string", function () {
          pm.expect(pm.response.text()).to.include("<h1>Student Assessments</h1>");
      });
