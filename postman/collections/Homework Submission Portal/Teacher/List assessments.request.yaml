$kind: http-request
description: Teacher assessment list, with the session saved by "Auth / Log in as teacher".
method: GET
url: "{{baseUrl}}/teacher/assessments"
order: 1000
headers:
  Cookie: session={{teacher_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Without a valid session, Flask-Login answers 302 to the login form
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is present", function () {
          pm.response.to.have.header("Content-Type");
      });

      pm.test("Body matches string", function () {
          pm.expect(pm.response.text()).to.include("<h1>Teacher Assessments</h1>");
      });
