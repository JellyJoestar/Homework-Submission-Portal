$kind: http-request
description: FR-RUB-01 setup adds a valid 100% rubric before the late-allowed assessment is published.
method: POST
url: "{{baseUrl}}/teacher/assessments/{{late_allowed_assessment_id}}/rubric"
order: 7450
headers:
  Cookie: session={{teacher_session}}
body:
  type: urlencoded
  content:
    title: Assessment criterion
    description: Evaluate the submitted assessment against its requirements.
    weight: "100"
    csrf_token: "{{teacher_csrf_token}}"
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("A valid rubric is saved before the late-allowed assessment is published", function () {
          pm.response.to.have.status(302);
          const id = pm.environment.get("late_allowed_assessment_id");
          pm.expect(pm.response.headers.get("Location"))
              .to.include("/teacher/assessments/" + id);
      });
