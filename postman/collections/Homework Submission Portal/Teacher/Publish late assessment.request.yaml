$kind: http-request
description: "Setup: the teacher publishes the late assessment, so students can see it (and try to submit)."
method: POST
url: "{{baseUrl}}/teacher/assessments/{{late_assessment_id}}/publish"
order: 7200
headers:
  Cookie: session={{teacher_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 302 (published)", function () {
          pm.response.to.have.status(302);
      });
