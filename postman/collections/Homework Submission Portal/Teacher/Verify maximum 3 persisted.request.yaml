$kind: http-request
description: Reads the created assessment detail page to prove maximum 3 was persisted.
method: GET
url: "{{baseUrl}}/teacher/assessments/{{ifn636_limit_id_three}}"
order: 5400
headers:
  Cookie: session={{teacher_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const html = pm.response.text().replace(/\s+/g, " ");
      const title = pm.environment.get("ifn636_limit_title_three");

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Detail page identifies the maximum 3 assessment", function () {
          pm.expect(html).to.include("<strong>Title:</strong> " + title);
      });

      pm.test("Maximum attempts 3 is persisted", function () {
          pm.expect(html).to.include("<strong>Maximum attempts:</strong> 3");
      });

      pm.test("Created assessment is Draft", function () {
          pm.expect(html).to.include("<strong>Status:</strong> Draft");
      });
