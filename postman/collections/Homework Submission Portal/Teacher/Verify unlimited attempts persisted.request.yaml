$kind: http-request
description: Reads the created assessment detail page to prove zero renders as Unlimited.
method: GET
url: "{{baseUrl}}/teacher/assessments/{{ifn636_limit_id_unlimited}}"
order: 5500
headers:
  Cookie: session={{teacher_session}}
settings:
  followRedirects: false
  disableCookies: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const html = pm.response.text().replace(/\s+/g, " ");
      const title = pm.environment.get("ifn636_limit_title_unlimited");

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Detail page identifies the unlimited assessment", function () {
          pm.expect(html).to.include("<strong>Title:</strong> " + title);
      });

      pm.test("Zero maximum attempts is shown as Unlimited", function () {
          pm.expect(html).to.include("<strong>Maximum attempts:</strong> Unlimited");
      });

      pm.test("Unlimited assessment is Draft", function () {
          pm.expect(html).to.include("<strong>Status:</strong> Draft");
      });
