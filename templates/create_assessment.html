{% extends "base.html" %}

{% block content %}
    <section class="app-page teacher-page assessment-form-page">
    <h1>Create Assessment</h1>
    <form
        class="assessment-form"
        method="POST"
        action="{{ url_for('views.create_new_assessment') }}"
    >
        <div class="form-field">
        <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >
        </div>
        <div class="form-field form-field-wide">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                >
            </textarea>
        </div>
        <div class="form-field form-field-wide">
            <label for="criteria">
                Assessment Criteria
            </label>

            <textarea
                id="criteria"
                name="criteria"
                rows="4"
            ></textarea>
        </div>
        <div class="form-field">
            <label for="due_date">Due Date</label>
            <input
                type="datetime-local"
                id="due_date"
                name="due_date"
            >
        </div>
        <div class="form-field">
        <label for="unit_id">Unit</label>
            <select id="unit_id"
                    name="unit_id"
                    required
            >
            {% for unit in units %}
                <option value="{{ unit.unit_id }}">
                    {{ unit.unit_code }} - {{ unit.unit_name }}
                </option>
            {% endfor %}
            </select>
        </div>
        <button type="submit">
            Create Draft Assessment
        </button>
    </form>
    </section>
{% endblock %}
