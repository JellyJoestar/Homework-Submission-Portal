{% extends "base.html" %}

{% block content %}
    <form
        method="POST"
        action="{{ url_for('views.create_new_assessment') }}"
    >
        <div>
        <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >
        </div>
        <div>
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                >
            </textarea>
        </div>
        <div>
            <label for="due_date">Due Date</label>
            <input
                type="datetime-local"
                id="due_date"
                name="due_date"
            >
        </div>
        <label for="unit_id">Unit</label>
            <select id="unit_id"
                    name="unit_id"
                    required
            >
            {% for unit in units %}
                <option value="{{ unit.unit_id }}">
                    {{ unit.unit_code }} - {{ unit.unit_name }}
                </option>
            {% endfor %}
            </select>
        <button type="submit">
            Create Draft Assessment
        </button>
    </form>
{% endblock %}
