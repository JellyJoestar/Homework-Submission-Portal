{% extends "base.html" %}

{% block content %}
    <section class="app-page teacher-page assessment-form-page">
    <h1>Edit Assessment</h1>
    <form
        class="assessment-form"
        method="POST"
        action="{{ url_for('views.edit_assessment', assessment_id=assessment.assessment_id) }}"
    >
        <div class="form-field">
        <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ assessment.title }}"
                required
            >
        </div>
        <div class="form-field">
            <label for="allow_late">Allow late submissions</label>
                <input type="checkbox" id="allow_late" name="allow_late" style="width: 20px; height: 20px;" {% if assessment.allow_late %}checked{% endif %}>
        </div>
        <div class="form-field form-field-wide">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                required
            >{{ assessment.description }}</textarea>
        </div>
        <div class="form-field form-field-wide">
            <label for="criteria">
                Assessment Guidance
            </label>

            <textarea
                id="criteria"
                name="criteria"
                rows="4"
            >{{ assessment.criteria or "" }}</textarea>
        </div>
        <div class="form-field">
            <label for="due_date">Due Date</label>
            <input
                type="datetime-local"
                id="due_date"
                name="due_date"
                value="{{ assessment.due_date.strftime('%Y-%m-%dT%H:%M') if assessment.due_date else '' }}"
            >
        </div>
        <div class="form-field">
            <label for="max_attempts">Maximum attempts</label>
            <input
                type="number"
                id="max_attempts"
                name="max_attempts"
                min="0"
                max="2147483647"
                step="1"
                value="{{ assessment.max_attempts }}"
                required
            >
            <small>Enter 0 for unlimited attempts.</small>
        </div>
        <div class="form-field">
        <label for="unit_id">Unit</label>
            <select id="unit_id"
                    name="unit_id"
                    required
            >
            {% for unit in units %}
                <option value="{{ unit.unit_id }}" {{ 'selected' if unit.unit_id == assessment.unit_id else '' }}>
                    {{ unit.unit_code }} - {{ unit.unit_name }}
                </option>
            {% endfor %}
            </select>
        </div>
        <button type="submit">
            Update Assessment
        </button>
    </form>
    </section>
{% endblock %}
