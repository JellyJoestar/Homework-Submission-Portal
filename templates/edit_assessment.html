{% extends "base.html" %}

{% block content %}
    <form
        method="POST"
        action="{{ url_for('views.edit_assessment', assessment_id=assessment.assessment_id) }}"
    >
        <div>
        <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ assessment.title }}"
                required
            >
        </div>
        <div>
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                required
            >{{ assessment.description }}</textarea>
        </div>
        <div>
            <label for="criteria">
                Assessment Criteria
            </label>

            <textarea
                id="criteria"
                name="criteria"
                rows="4"
            >{{ assessment.criteria or "" }}</textarea>
        </div>
        <div>
            <label for="due_date">Due Date</label>
            <input
                type="datetime-local"
                id="due_date"
                name="due_date"
                value="{{ assessment.due_date.strftime('%Y-%m-%dT%H:%M') if assessment.due_date else '' }}"
            >
        </div>
        <label for="unit_id">Unit</label>
            <select id="unit_id"
                    name="unit_id"
                    required
            >
            {% for unit in units %}
                <option value="{{ unit.unit_id }}" {{ 'selected' if unit.unit_id == assessment.unit_id else '' }}>
                    {{ unit.unit_code }} - {{ unit.unit_name }}
                </option>
            {% endfor %}
            </select>
        <button type="submit">
            Update Assessment
        </button>
    </form>
{% endblock %}
